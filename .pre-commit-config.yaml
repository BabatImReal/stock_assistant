# Runs on every `git commit` once `uv run pre-commit install` has been done.
# Purpose: never commit a formatting-only diff, and never commit a .env.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff          # lint, autofix what it safely can
        args: [--fix]
      - id: ruff-format   # format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files   # data files belong in data/, not in git
      - id: detect-private-key
