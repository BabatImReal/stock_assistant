# Vietnamese market holidays: WEEKDAYS the market is closed (Ben, 2026-09-23).
#
# Why a DATED list: Tet and Hung Kings follow the LUNAR calendar, so their
# solar dates move every year and no rule in code can produce them. Each date is
# written out, per year.
#
# What is listed (121 weekdays, 2012 -> 2026-09-21):
#   - statutory holidays that fall on a weekday: New Year 1/1, Tet lunar
#     1/1-1/3, Hung Kings lunar 10/3, Reunification 30/4, Labour Day 1/5,
#     National Day 2/9;
#   - the compensation day "in lieu of" a statutory holiday that fell on a
#     weekend (the next working day);
#   - the documented 2025 swap: Fri 2025-05-02 off (worked Sat 2025-04-26).
# Every date was VERIFIED on 2026-09-23 against both sources: no session in
# CafeF's calendar (trading_day), no bar_raw row, and no traded VNINDEX session
# in vnstock (VCI). 0 conflicts.
#
# What is NOT listed, on purpose: the extra Tet days (30/12, lunar 1/4-1/5 and
# bridges), National Day's second day (2021 on), and other bridge days. The
# government sets those by decree each year, and they could not be verified as
# a rule. So this is a MINIMUM list: a session on a listed date is certainly
# wrong (data/checks.py fails the build), but an unlisted weekday without a
# session is not proof of a data gap.
#
# MAINTENANCE: add each new year's dates when HOSE/SSC announce them (usually
# late in the previous year), and verify them against vnstock once the year has
# traded. A year with no entry is simply unchecked.
holidays:
