# FROZEN 2026-10-05, before any forward event is recorded or any 2026-10-06 data
# exists. Registration text: docs/preregistration/chart-forward-v3.md.
# Changing ANY value after the first forward row is recorded starts a new version
# with a new forward clock (the log refuses rows made under a different hash).
version: 3
status: forward_only_shadow_track
registered_on: "2026-10-05"
# Forward events = signal days STRICTLY AFTER this date. Nothing earlier counts.
frozen_on: "2026-10-05"

# The detector is the already-frozen v2 detector, UNCHANGED. v3 adds no geometry,
# no variant and no threshold, hence no new trials.
detector:
  chart_rules_hash: 92c387181435be5a
  chart_code_hash: 9ef457b528d8d70f
  geometry_base: {rules_hash: 714965cdc639e7ac, code_hash: f019f46d9336aa38}
history_start: "2012-01-01"  # segments start where the census started, always

# Labels only; the population is identical to v2. The double-level family is NOT a
# claim of a prior-trend reversal (only 15.8% of those episodes carry one).
labels:
  double_top: repeated_highs
  double_bottom: repeated_lows
  symmetric_triangle: symmetric_triangle
  ascending_triangle: ascending_triangle
  descending_triangle: descending_triangle

# Every confirmed first break is LOGGED. Only events that are point-in-time liquid
# and resolved (not fill-flagged) at the primary horizon enter the decision sample.
outcome:
  long_only: true
  primary_horizon: 10          # sessions after entry; 3, 5, 20 are reported, never decisive
  entry: next_session_open     # no trade if it opens at the ceiling
  exit: close_of_session_k_after_entry
  cost: {broker_fee_per_side: 0.0015, sale_tax: 0.001}  # confirmed by Ben 2026-10-05
comparator:
  kind: same_signal_day_liquid_cross_section
  gates: [pit_liquid, resolved_at_k, not_fill_flagged, observable]
  metric: excess_net = net_k - mean(net_k over the comparator that day)

hypotheses:
  H1_up_excess:   {sides: [up],   direction: greater, metric: excess_net_10}
  H2_down_avoid:  {sides: [down], direction: less,    metric: excess_net_10}
  # H2 is an AVOID/risk hypothesis for a long-only user, never a short.
inference:
  unit: signal_day_cluster
  one_sided: true
  alpha_per_hypothesis: 0.025
  looks_at_resolved_events: [60, 120, 240]
  alpha_per_look: 0.008        # 0.025 / 3, rounded down
  stop_for_futility: false
  final_look: "240 resolved events or 2029-10-05, whichever first"
  secondary_reported_only: [hit_rate_vs_base_share, variant_x_side_cells, other_horizons]
