# Vietnamese market rules that change the arithmetic (doc §5.6).
#
# These are FACTS about the market, not tuning choices -- but they change over
# time, so every value carries the date it took effect. A backtest must apply
# the rule in force on the date it is testing, not today's rule (doc §7.5).
#
# VERIFICATION STATUS is recorded per block. The doc says explicitly that these
# must be re-confirmed against the exchanges before building, and "I could not
# confirm this" is written down rather than smoothed over.

price_limits:
  # VERIFIED against broker trading guides for the CURRENT values.
  # The 2013-01-15 widening is from the knowledge document (doc §7.5 notes the
  # early years differed) and is NOT independently confirmed.
  HOSE:
    - {from: "2000-07-28", limit: 0.05, verified: false}
    - {from: "2013-01-15", limit: 0.07, verified: true}
  HNX:
    - {from: "2005-07-14", limit: 0.07, verified: false}
    - {from: "2013-01-15", limit: 0.10, verified: true}
  UPCOM:
    - {from: "2009-06-24", limit: 0.10, verified: false}
    - {from: "2013-01-15", limit: 0.15, verified: true}

first_day_limits:
  # Wider band on a security's first trading day, and on resumption after a
  # long suspension. VERIFIED against a broker trading guide (current values).
  # These are why "first trading day" and "resumption after a gap" are separate
  # classes in the price-limit check: they are not violations, they are a
  # different rule.
  HOSE: 0.20
  HNX: 0.30
  UPCOM: 0.40
  # A suspension of at least this many sessions puts the security back under
  # the first-day band when it resumes.
  resumption_after_sessions: 25

tick_size:
  # In THOUSANDS of VND, matching how CafeF quotes prices.
  #
  # HOSE cut its tick sizes on 2016-09-12 -- VERIFIED (the change is documented
  # in the academic literature on Vietnamese market microstructure, and the
  # current bands match broker guides). Before that date a share under 50,000
  # VND moved in 100 VND steps, so at 600 VND one tick was 16.7 percent and a
  # percentage-based limit check is meaningless without allowing for it.
  HOSE:
    - from: "2000-07-28"
      verified: false
      bands:
        - {under: 50.0,  tick: 0.10}   # 100 VND
        - {under: 100.0, tick: 0.50}   # 500 VND
        - {under: null,  tick: 1.00}   # 1,000 VND
    - from: "2016-09-12"
      verified: true
      bands:
        - {under: 10.0,  tick: 0.01}   # 10 VND
        - {under: 50.0,  tick: 0.05}   # 50 VND
        - {under: null,  tick: 0.10}   # 100 VND
  # HNX and UPCoM: a flat 100 VND step, VERIFIED as the current rule. I could
  # find no evidence of an earlier, different value for either, but absence of
  # evidence is not evidence of absence -- treated as unverified before today.
  HNX:
    - from: "2005-07-14"
      verified: false
      bands:
        - {under: null, tick: 0.10}
  UPCOM:
    - from: "2009-06-24"
      verified: false
      bands:
        - {under: null, tick: 0.10}

settlement:
  # Shares bought today arrive this many trading days later, so the earliest
  # realistic sell is the following session (doc §5.6). This is the rule that
  # makes a 1-day pattern edge untradeable and the 3-5 day horizon viable.
  #
  # NOT VERIFIED. Ben believes T+3 before 2016 and T+2 after, which matches the
  # common account, and Circular 203/2015/TT-BTC (issued 2015-12-21) is the
  # instrument usually cited. I could not confirm the effective date from a
  # primary source in this session, so the date below is a best estimate and
  # must be checked before any backtest depends on it.
  cycles:
    - {from: "2000-07-28", days: 3, verified: false}
    - {from: "2016-01-01", days: 2, verified: false}
  # Separately and later, the time of day shares become available was brought
  # forward within the T+2 cycle (reported as 2022-08-29). It does not change
  # the number of days, so it does not affect the earliest sell SESSION.
  intraday_change_note: "2022-08-29, availability moved earlier within T+2"
