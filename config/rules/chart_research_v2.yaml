# Fixed before any side-conditioned Vietnamese return was examined.
# The old v1 event/return artifact remains immutable and descriptive only.
version: 2
status: research_only
geometry_base:
  rules_hash: 714965cdc639e7ac
  code_hash: f019f46d9336aa38
variants: [double_top, double_bottom, symmetric_triangle, ascending_triangle, descending_triangle]
observed_break_sides: [up, down]
horizons: [3, 5, 10, 20]
primary_horizon: 10
registered_trial_count: 40  # five variants x two observed sides x four horizons
eligible_history_sessions: 125
baseline: all_eligible_stock_days_with_pit_tier_fallback
long_only_outcome: net_return_positive
# This is a geometry validity rule, not a return-optimized threshold.
# Each adjusted close from the first through last formation anchor must be
# inside both extrapolated frozen boundaries, with the *existing* v1 tolerance
# for that family. The existing stricter 0.5% no-early-break rule continues
# from the last anchor to candidate confirmation. A breach discards the
# candidate before it can suppress a later valid episode.
formation_containment:
  required: true
  anchor_window: first_through_last_inclusive
  repeated_level_tolerance: 0.015
  triangle_tolerance: 0.01
comparison_periods:
  development_seen: [2012-01-01, 2019-12-31]
  replication_seen: [2020-01-01, 2023-12-31]
  interpretation: descriptive_spent_history_not_confirmation
