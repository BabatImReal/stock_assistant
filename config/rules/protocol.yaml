# THE RESEARCH PROTOCOL: PRE-REGISTERED (doc §8.2; Ben, E3, 2026-09-24).
#
# Written and committed BEFORE the first discover run, so what is tested, how
# it is judged and what would count as success were fixed before any result
# was seen. The `registered` block is FROZEN: its hash is written into the
# hypothesis log (research/hypothesis_log.csv) on the first run, and every later
# run refuses a changed block (backtest/protocol.py). A new idea goes into
# `additions`, is logged, counts in N, and may only be tested on data no run
# has used yet.

registered:
  version: 1
  registered_on: "2026-09-24"

  # --- the hypothesis vocabulary (ruling A7) --------------------------------
  # One hypothesis = a trigger, 0, 1 or 2 of the conditions, and a horizon:
  # 21 x (1 + 8 + 28) x 2 = 1,554. The bullish/bearish label is never used:
  # every hypothesis is tested two-sided (doc §6.3: labels can be wrong).
  horizons: [3, 5]                  # ruling A1: both, both count in N
  triggers:
    - hammer_shape
    - inverted_hammer_shape
    - doji
    - marubozu_green
    - marubozu_red
    - bullish_engulfing
    - bearish_engulfing
    - bullish_harami
    - bearish_harami
    - piercing_line
    - dark_cloud_cover
    - morning_star
    - evening_star
    - three_white_soldiers
    - three_black_crows
    - three_inside_up
    - three_inside_down
    - tight_range
    - inside_day_run
    - higher_lows
    - breakout
  # Each condition is a FIXED comparison (patterns.fingerprint.query). No sector
  # measure: every sector value is flagged (B3), so none may enter a validated
  # result.
  conditions:
    rvol_high: {rvol: ">=1.5"}
    above_ma_50: {price_vs_ma_50: ">0"}
    ma_50_rising: {ma_50_slope: ">0"}
    at_support: {near_support: 1}
    at_resistance: {near_resistance: 1}
    market_up: {index_above_ma_50: 1}
    breadth_positive: {breadth_advance_share_10d: ">=0.5"}
    volume_dry: {volume_dry_up: 1}
  max_conditions: 2

  # --- the split (ruling A5) --------------------------------------------------
  # Each slice drops every row whose outcome is not known strictly before the
  # next slice starts (the purge), through backtest.evidence.validated.
  slices:
    discover: {start: "2012-01-01", end: "2019-12-31"}
    validate: {start: "2020-01-01", end: "2023-12-31"}
    # end = the freeze F, set 2026-09-24 before the one holdout run, computed by
    # protocol.freeze_date from the stored returns (build 5, last settled
    # session 2026-09-21): the last session before the first entry with an
    # outcome still pending (2026-09-11, an exit deferred at the floor), so
    # every k=3 and k=5 outcome of an entry in [start, F] is final. Left out of
    # the protocol hash (protocol.protocol_hash): the one value left open.
    holdout: {start: "2024-01-01", end: "2026-09-10"}

  # --- what a result is -------------------------------------------------------
  hit: "net return > 0 (fee PROVISIONAL until Ben confirms it)"
  universe: "liquid on t (data.universe), through backtest.evidence.validated"
  # Below this many DE-CLUSTERED occurrences in a slice a hypothesis is not
  # testable there: p = 1, and it still counts in N.
  min_declustered: 30
  suspicious_hit_rate: 0.75         # above this: "suspect a bug first"
  regime: index_above_ma_50         # every result is also split by it (G7)

  # --- discover: multiple-testing control (ruling A6) -------------------------
  fdr_q: 0.10                       # Benjamini-Hochberg over ALL N hypotheses
  # Significance by resampling BLOCKS OF DATES, never rows: many stocks move
  # together on one day, and an outcome window spans several days.
  bootstrap:
    block_sessions: 10
    resamples: 2000
    seed: 20260924

  # --- validate: a discover survivor must hold, with no retuning -------------
  validate_rule:
    same_sign: true
    min_edge: 0.03                  # at least +3 points over the base rate
    min_net_expectancy: 0.0         # strictly above

  # --- holdout: written down BEFORE it is ever touched; run ONCE, with Ben ---
  holdout_rule:
    text: >-
      A validated survivor is ACCEPTED only if, on the holdout (2024-01-01 to
      the freeze date), its edge keeps its discover sign AND its mean net
      return per de-clustered occurrence is above zero, with at least 30
      de-clustered occurrences. Nothing is tuned after it is seen.
    same_sign: true
    min_net_expectancy: 0.0
    min_declustered: 30

# --- E4: the look-alike search, PRE-REGISTERED 2026-09-24 before it runs -----
# Its OWN frozen block (hash written into research/neighbours_log.csv on the
# first run; a changed block is refused afterwards). Adding it does not touch
# `registered` above, so the E3 log stays valid.
#
# ILLUSTRATIVE, not a statistical claim: it shows Ben past days that looked like
# today, with what followed. Nothing here enters N or the validated results.
neighbours:
  version: 1
  registered_on: "2026-09-24"
  # A neighbour must have EXACTLY today's fired set of the registered
  # triggers (the 21 above): every trigger known on both days and equal. A
  # trigger that could not be judged (NaN) never matches anything.
  match_exactly: triggers
  # Ranked by distance on these context measures (no sector: flagged, B3).
  numeric:            # -> the same-day percentile among the day's LIQUID
    - rvol            #    stocks; never scaled over full history
    - up_down_volume_ratio
    - price_vs_ma_20
    - price_vs_ma_50
    - ma_20_slope
    - ma_50_slope
    - price_change_10d
    - price_change_20d
    - range_rel_20d
    - body_to_range
    - upper_wick_to_range
    - lower_wick_to_range
    - open_gap
  boolean:            # kept as 1 / 0; NaN stays unknown
    - near_support
    - near_resistance
    - volume_dry_up
    - index_above_ma_50
  # Distance = the mean absolute difference over the columns known on BOTH
  # days (equal weights). A missing value never matches a 0: the column is
  # left out, and a pair needs at least this share of columns known on both.
  min_known_share: 0.8
  k: 50
  horizons: [3, 5]
  # The pool: liquid stock-days through the gate (backtest.evidence.validated),
  # outcome resolved strictly before the query day. UNTIL THE HOLDOUT IS RUN,
  # the pool also stops before the holdout starts, so no holdout-period
  # outcome is seen before Ben and I run it.
  pool_before: "2024-01-01"

# Hypotheses registered AFTER the first run: {trigger, conditions: [names],
# horizon, added_on}. Logged, counted in N, and tested only on data not used.
additions: []

# --- THE DAILY SCAN, PRE-REGISTERED 2026-09-24 before any forward day is scored.
# Its OWN frozen block: its hash goes into every row of the paper-trading ledger
# (research/paper_ledger.csv), and once the ledger has a row a changed block is
# refused (report/scan.py). Adding it does not touch `registered` or
# `neighbours`, so their logs stay valid.
daily_scan:
  # Version 2 (Ben, 2026-09-24, BEFORE any forward day was recorded): HOSE
  # first. Ben's focus is HOSE ~85% / HNX ~12% / UPCoM ~3%: HOSE holds the big,
  # reliable companies; HNX and UPCoM are mostly small caps that are hard to
  # analyse. Version 1 (no exchange key) ran only on days before the freeze.
  version: 2
  registered_on: "2026-09-24"
  # What may be proposed: EXACTLY the ACCEPTs of the latest holdout run in the
  # hypothesis log, as-is. No filter fitted on the holdout or its description.
  signals: holdout_accepted
  # A (signal, stock) pair is a candidate on T when the signal fired on T's
  # fingerprint (every condition known and true: unknown never fires), the
  # stock is liquid on T (data.universe.tiers), and its fillability can be
  # judged at T: a DATED exchange that is not UPCoM. The holdout's gate
  # (backtest.evidence.validated) blanked every outcome resting on an undated
  # or UPCoM fillability judgement, so no accepted signal was ever measured on
  # one; proposing it would trade something the frozen rule never accepted.
  # ONE candidate is proposed, by these keys in order (Ben, 2026-09-24):
  tie_breaker:
    # The exchange FIRST: an HNX stock is proposed only when no HOSE stock is
    # eligible that day. UPCoM stays excluded by the eligibility rule above.
    - {key: exchange, prefer: [HOSE, HNX, UPCOM]}
    # The validate slice's net expectancy, from the log: PER TRADE and frozen.
    # It only ranks; it is never reported as a forward metric.
    - {key: validate_expectancy, prefer: highest}
    # Mean traded_value (fingerprint) over the stock's last 20 sessions up to
    # and including T: known at T. Fewer than 20 sessions ranks last.
    - {key: traded_value_20d, prefer: highest}
    # data.universe tiers: 3 = MOST liquid, 1 = least. Ben's instruction reads
    # "tier 1 = most liquid"; the code numbers them the other way, so this key
    # prefers the more liquid tier, which is what the instruction means.
    - {key: tier, prefer: most_liquid}
    - {key: symbol, prefer: alphabetical}
  traded_value_sessions: 20

# --- PAPER TRADING, PRE-REGISTERED 2026-09-24 (Ben set these numbers; change
# them only if Ben says so). Its OWN frozen block, hash in every ledger row.
paper_trading:
  version: 1
  registered_on: "2026-09-24"
  # The forward record = signal days STRICTLY AFTER this date (the date of the
  # commit that freezes these blocks). Earlier days may be shown, labelled
  # BEFORE THE FREEZE, and are never part of the forward record.
  frozen_on: "2026-09-24"
  # The unit is the SIGNAL DAY: one proposal a day, one stake, entry at the
  # next open, exit at the signal's k (backtest.forward_returns: no buy at the
  # ceiling, a floor-locked exit waits), net at the all-in cost. Never per
  # de-clustered trade.
  unit: signal_day
  hit: "net > 0"
  # A proposal whose outcome was decided AT ENTRY with no trade (the next
  # session opens at the ceiling, the stock does not trade, ...) is VOID: no
  # stake was placed; counted and shown, never scored. One whose stake was
  # placed but has no return (stuck: a gap in the hold, an exit locked at the
  # floor past the cap, the data ends) is STUCK: it withholds any verdict
  # until Ben rules on it, because dropping it would hide a loss.
  verdict:
    min_signal_days: 30
    # The first to the last scored signal day spans at least this many
    # calendar months.
    min_span_months: 3
    pass:
      cumulative_above: 0.0       # stakes
      drawdown_at_least: -1.0     # max drawdown no worse than -1.0 stake
      positive_months: majority   # strictly more than half the months net > 0
    fail:                         # either, once the minimum sample is reached
      cumulative_at_most: 0.0
      drawdown_below: -1.5        # at any point of the record
    # Otherwise PROVISIONAL: keep accumulating.
  fee: "no PASS/FAIL is declared while the broker fee is PROVISIONAL"
  # The record per family is shown as information; the bar is on the aggregate.
  families: information_only

# --- NEW-HYPOTHESIS BATCHES: CANDIDATE GENERATION, NOT CONFIRMATION ----------
# Registered 2026-09-24, AFTER the holdout was spent and after the first run's
# results were seen. The discover (2012-2019) and validate (2020-2023) slices
# were already looked at by the registered run, so a survivor here is at best
# a PAPER-TRADING CANDIDATE; the forward ledger is the only arbiter left. The
# holdout is not run for a batch (there is no code path for it).
#
# Each batch is its OWN frozen block: its hash goes into every row of
# research/hypothesis_log_batches.csv (the original hypothesis log is never
# written by a batch), a changed block is refused afterwards, and each slice
# runs ONCE per batch. Everything not stated here is taken unchanged from
# `registered`: the triggers, the conditions, the slices and their purge, the
# de-clustering, min_declustered, the date-block bootstrap, the suspicious
# flag, the regime split and the year-by-year walk-forward.
batches:
  complements_1:
    version: 1
    registered_on: "2026-09-24"
    # THE RULE THAT DEFINES THE SET (no hand-picking): the registered context
    # vocabulary made two-sided. Every registered condition gains its EXACT
    # logical complement, not_<name>: the other side of the same comparison
    # on the same measure (>= -> <, > -> <=, == -> !=). No new measure, no new
    # threshold; a value that cannot be judged stays unknown on both sides.
    # The batch = every registered trigger x every set of 1 or 2 conditions
    # drawn from the 16 x every registered horizon, that contains at least
    # one complement (the rest were registered) and never a condition
    # together with its own complement (a contradiction).
    # 21 triggers x (8 + 84) condition sets x 2 horizons:
    n: 3864
    max_conditions: 2
    # The fee is out of scope for this batch (Ben, 2026-09-24): hit = GROSS
    # return > 0, base rate the same. Net at the provisional cost is reported
    # beside each result as information only; it gates nothing.
    hit: gross
    discover:
      fdr_q: 0.10              # Benjamini-Hochberg over THIS batch's N
      min_abs_edge: 0.03       # the edge's magnitude, either sign
    validate:
      same_sign: true
      min_gross_expectancy: 0.0  # strictly above
    # A PAPER-TRADING CANDIDATE: held on validate with a POSITIVE edge (a
    # negative one cannot be traded: no short selling in Vietnam).
    # "Materially stronger than the six": on validate, on this batch's gross
    # basis, a higher edge AND a higher gross expectancy than the best of the
    # six holdout ACCEPTs, AND at least as many walk-forward years positive.
    stronger_than_six: [edge, gross, years_positive]
