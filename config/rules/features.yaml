# Feature measures: which are on, and with what parameters.
#
# Every measure is a RULE that can be switched on and off and measured
# (doc §4: volume is defined and measured exactly like a pattern). Turning one
# off is a config change, never a code change, and the enabled set plus the
# resolved parameters are recorded with every computation so a number can be
# traced back to the exact measure version that produced it.
#
# Thresholds here are CHOICES, not facts (doc §3.5). These are the textbook
# starting values from doc §4.1; they are fixed BEFORE anything is measured and
# are not to be tuned while looking at results (doc §8.1).
#
# NON-NEGOTIABLE: every measure below reads MATCHED volume only. Negotiated
# block volume lives in a different table and no money-flow measure may touch
# it (doc §4.3) -- one pre-agreed deal can otherwise fake a day of accumulation.

measures:
  # --- doc §4.1, in this slice -------------------------------------------
  rvol:
    enabled: true
    lookback_days: 20          # average of the PREVIOUS 20 sessions
  sustained_volume:
    enabled: true
    window_days: 7             # doc says "last 5-7"; 7 is the looser end
    threshold: 1.5             # RVOL above this counts as a heavy day
    rvol_lookback_days: 20
  up_down_volume_ratio:
    enabled: true
    window_days: 20            # volume on green days vs red days
  price_volume_agreement:
    enabled: true
    window_days: 10            # price up AND volume up over the window
    min_price_change: 0.03     # "rising" must mean something; 3% over 10 days
    min_volume_change: 0.10
  price_volume_divergence:
    enabled: true
    window_days: 10            # price up while volume shrinks
    min_price_change: 0.03
    max_volume_change: -0.10
  traded_value:
    enabled: true              # close x matched volume; comparable across prices
  volume_dry_up:
    enabled: true
    max_rvol: 0.7              # volume well below normal
    rvol_lookback_days: 20
    quiet_days: 3              # ... and sustained, not a single quiet session

  # --- doc §5.1-5.2, per-symbol trend and levels -------------------------
  # These read PRICE only, never volume, so they remain available on
  # backfilled spans where the price is adjusted and the volume never could be.
  ma_20:            {enabled: true, window_days: 20}
  ma_50:            {enabled: true, window_days: 50}
  ma_20_slope:      {enabled: true, window_days: 20, slope_days: 5}
  ma_50_slope:      {enabled: true, window_days: 50, slope_days: 10}
  price_vs_ma_20:   {enabled: true, window_days: 20}
  price_vs_ma_50:   {enabled: true, window_days: 50}
  price_change_10d: {enabled: true, window_days: 10}
  price_change_20d: {enabled: true, window_days: 20}
  near_support:
    enabled: true
    lookback_days: 60          # doc §5.2: "held at least twice in the last 60 days"
    pivot_k: 2                 # a pivot needs 2 rows either side to be confirmed
    tolerance: 0.02            # "within ~2%"
    min_touches: 2             # once is an accident; twice is a level
  near_resistance:
    enabled: true
    lookback_days: 60
    pivot_k: 2
    tolerance: 0.02
    min_touches: 2

  # --- doc §5.3, market regime from the index ----------------------------
  # Computed ONCE per run from index_bar and joined onto every symbol by
  # trade_date. A symbol day the index does not cover is NaN, never
  # forward-filled: carrying yesterday's regime forward would assert a market
  # state we have no index for.
  index_above_ma_50:       {enabled: true, window_days: 50}
  index_ma_50_slope:       {enabled: true, window_days: 50, slope_days: 10}
  index_change_20d:        {enabled: true, window_days: 20}
  index_drawdown_from_high: {enabled: true, window_days: 60}

  # --- doc §5.3, breadth (its own frame; features/breadth.py) -------------
  # Over ALL TRADEABLE stocks, not the liquid universe (Ben, 2026-09-23): the
  # point is the broad participation the cap-weighted index misses. Direction
  # on the ADJUSTED close. A stock counts only if it also traded the session
  # before.
  #
  # Thin-day guard: a session counting < min_count_share x the median count of
  # the previous count_median_sessions is blanked. It is a DATA-DEFECT guard (a
  # lost exchange file), not a research threshold. 0.80 was set on 2026-09-23
  # from the measured distribution of count / trailing median, before any
  # breadth statistic was computed: median 1.00, 5th pct 0.93, 2nd pct 0.85.
  # Every whole-exchange loss is <= 0.73 (2025-05-05/06, 2024-12-02..05,
  # 2023-01 cluster, 2018-01-23..25 HOSE halt); most lost HNX files are
  # 0.76-0.83. Blanks 54 of 3,689 sessions. Known ceiling: partial losses at
  # 0.80-0.90 pass and bias that day by a few points.
  breadth_advance_share:
    enabled: true
    min_count_share: 0.80
    count_median_sessions: 20
  breadth_advance_share_10d:
    enabled: true
    window_days: 10
    min_count_share: 0.80
    count_median_sessions: 20

  # --- doc §5.4, sector (its own (date, sector) frame; features/sector.py) --
  # ICB level 2 from vnstock VCI, with steel split out of basic resources: the
  # ONE manual exception (data/sectors.py). Members = ALL tradeable stocks;
  # equal-weighted MEDIAN daily return on adjusted close; a stock counts only
  # if it also traded the session before.
  #
  # LABELS ARE CURRENT-ONLY before the first dated snapshot (2026-09-23), so
  # every historical value is FLAGGED and quarantined from validated results
  # (features/base.py quarantine_flagged; decisions.md 2026-09-23).
  #
  # Thin sector-day guard (data-defect / too-few-members, not a research
  # threshold), set 2026-09-23 from the measured counts BEFORE any sector
  # statistic: min_members 5 (a median of fewer than five is one company's
  # news, not a sector) plus the breadth-style drop vs the trailing median.
  # Blanks 8.7% of sector-days since 2012. Banks 1.2%, securities 1.5%, real
  # estate 1.5%, steel 2.5%, but Telecom 59% and Oil & Gas 36% (median 3
  # and 7 members): those two sectors are mostly unscored, on purpose.
  sector_change_20d:
    enabled: true
    window_days: 20
    min_members: 5
    min_count_share: 0.80
    count_median_sessions: 20
  # Must use the same window_days as sector_change_20d (compute() enforces it).
  stock_vs_sector_20d:
    enabled: true
    window_days: 20

  # --- doc §3.1, patterns tranche 1: candle anatomy + single-candle shapes --
  # patterns/candles.py. Textbook values from doc §3.1, FIXED BEFORE ANY
  # MEASURING (doc §3.5, §8.1); moved here from patterns.yaml (Ben, P2) so the
  # FeatureSet fingerprint covers them. Shapes are ONE flag each (P1): the
  # trend before the candle comes from the trend measures, never from the flag.
  body_to_range:         {enabled: true}
  upper_wick_to_range:   {enabled: true}
  lower_wick_to_range:   {enabled: true}
  range_rel_20d:         {enabled: true, window_days: 20}
  open_gap:              {enabled: true}
  # min_range_ticks (P5): the RAW range must be at least this many ticks (the
  # largest tick of any exchange at that price and date), so a 1-2 tick
  # candle can never be a shape by accident. 3 = "more than tick noise"; a
  # choice, fixed now, not tuned.
  hammer_shape:
    enabled: true
    lower_wick_to_body_min: 2.0     # doc: lower wick >= 2 x body
    upper_wick_to_body_max: 0.5     # doc: small upper wick
    body_min_position: 0.6667       # body in the top third of the range
    min_range_ticks: 3
  inverted_hammer_shape:
    enabled: true
    upper_wick_to_body_min: 2.0     # doc: upper wick >= 2 x body
    lower_wick_to_body_max: 0.5     # the mirror of the hammer's small wick
    body_max_position: 0.3333       # body in the bottom third of the range
    min_range_ticks: 3
  doji:
    enabled: true
    body_to_range_max: 0.10         # doc: body <= ~5-10% of range (the loose end)
    min_range_ticks: 3
  marubozu_green:
    enabled: true
    body_to_range_min: 0.90         # doc: body >= ~90% of range
    min_range_ticks: 3
  marubozu_red:
    enabled: true
    body_to_range_min: 0.90
    min_range_ticks: 3

  # --- doc §3.2, patterns tranche 2: two-candle patterns --------------------
  # patterns/two_candle.py. Dated on TODAY; read yesterday, so a pair across a
  # trading gap is blank. Textbook values from doc §3.2, FIXED BEFORE ANY
  # MEASURING (moved here from patterns.yaml, P2).
  # min_prior_body_ticks: yesterday's RAW body must be at least this many
  # ticks (the dated exchange's tick; the largest where undated), so a
  # 1-2 tick body cannot make "covers", "inside" or "past its midpoint" true
  # on noise. 3 = the same "more than tick noise" as the tranche-1 floor.
  bullish_engulfing:
    enabled: true
    min_body_cover: 1.0             # doc: today's body covers yesterday's
    min_prior_body_ticks: 3
  bearish_engulfing:
    enabled: true
    min_body_cover: 1.0
    min_prior_body_ticks: 3
  # LONG (P3): yesterday's body >= long_body_vs_avg_min x the mean body of the
  # long_body_window sessions BEFORE yesterday.
  bullish_harami:
    enabled: true
    max_body_ratio: 0.5             # today's body at most half of yesterday's
    long_body_vs_avg_min: 1.0
    long_body_window: 20
    min_prior_body_ticks: 3
  bearish_harami:
    enabled: true
    max_body_ratio: 0.5
    long_body_vs_avg_min: 1.0
    long_body_window: 20
    min_prior_body_ticks: 3
  piercing_line:
    enabled: true
    min_close_into_prev_body: 0.5   # doc: closes above the midpoint
    min_prior_body_ticks: 3
  dark_cloud_cover:
    enabled: true
    min_close_into_prev_body: 0.5   # the mirror: below the midpoint
    min_prior_body_ticks: 3

  # --- doc §3.3, patterns tranche 3: three-candle patterns ------------------
  # patterns/three_candle.py. Dated on day 3; a gap or excluded row ANYWHERE
  # in the window blanks it. FIXED BEFORE ANY MEASURING. star_body_max,
  # min_close_into_first_body and max_wick_to_range are NEW values (doc §3.3
  # gives words, not numbers): textbook-typical choices, fixed now, not tuned.
  # min_large_body_ticks: the LARGE candles' RAW body must be at least this
  # many ticks (a star's middle candle is not floored; its small body is the
  # point). P4: the star opens beyond d1's close instead of a true gap.
  morning_star:
    enabled: true
    star_body_max: 0.3              # the star's body <= 30% of d1's
    min_close_into_first_body: 0.5  # doc: d3 closes "well into" d1's body
    long_body_vs_avg_min: 1.0       # P3: d1 and d3 LONG vs the pre-pattern mean
    long_body_window: 20
    min_large_body_ticks: 3
  evening_star:
    enabled: true
    star_body_max: 0.3
    min_close_into_first_body: 0.5
    long_body_vs_avg_min: 1.0
    long_body_window: 20
    min_large_body_ticks: 3
  three_white_soldiers:
    enabled: true
    max_wick_to_range: 0.25         # each closes near its high
    min_large_body_ticks: 3
  three_black_crows:
    enabled: true
    max_wick_to_range: 0.25         # each closes near its low
    min_large_body_ticks: 3
  # three-inside = the tranche-2 harami on d1-d2 (its own parameters, repeated
  # here so each measure is self-contained) + d3 closing beyond d1's open.
  three_inside_up:
    enabled: true
    max_body_ratio: 0.5
    long_body_vs_avg_min: 1.0
    long_body_window: 20
    min_prior_body_ticks: 3
  three_inside_down:
    enabled: true
    max_body_ratio: 0.5
    long_body_vs_avg_min: 1.0
    long_body_window: 20
    min_prior_body_ticks: 3

  # --- doc §3.4, patterns tranche 4: short consolidations -------------------
  # patterns/consolidation.py. Dated on the last day; blank if the window
  # spans a gap. FIXED BEFORE ANY MEASURING (moved from patterns.yaml, P2).
  # Flag/pause is deferred (P7).
  tight_range:
    enabled: true
    lookback_days: 5                # doc: "average range of last N days"
    baseline_days: 20               # doc: "... < X% of the 20-day average range"
    range_vs_baseline_max: 0.6      # X = 60%
    min_baseline_ticks: 3           # a normal range of 1-2 ticks is noise
  inside_day_run:
    enabled: true
    min_days: 2                     # NEW: at least two inside days in a row
    min_mother_range_ticks: 3       # the first bar must be a real bar
  higher_lows:
    enabled: true
    lookback_days: 4                # four days of rising lows
    highs_flat_tolerance: 0.02      # NEW: highs within 2% of the close
  # PRICE-ONLY (P6): the old min_rvol 1.5 is gone. "Breakout on strong
  # volume" is breakout AND rvol >= 1.5 as a fingerprint combination.
  breakout:
    enabled: true
    lookback_days: 20               # close above the highest high of 20 sessions

# Which index the regime measures read. VN-Index is the market doc §5.3 means.
market:
  index_symbol: VNINDEX
