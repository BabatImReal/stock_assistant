# Feature measures: which are on, and with what parameters.
#
# Every measure is a RULE that can be switched on and off and measured
# (doc §4: volume is defined and measured exactly like a pattern). Turning one
# off is a config change, never a code change, and the enabled set plus the
# resolved parameters are recorded with every computation so a number can be
# traced back to the exact measure version that produced it.
#
# Thresholds here are CHOICES, not facts (doc §3.5). These are the textbook
# starting values from doc §4.1; they are fixed BEFORE anything is measured and
# are not to be tuned while looking at results (doc §8.1).
#
# NON-NEGOTIABLE: every measure below reads MATCHED volume only. Negotiated
# block volume lives in a different table and no money-flow measure may touch
# it (doc §4.3) -- one pre-agreed deal can otherwise fake a day of accumulation.

measures:
  # --- doc §4.1, in this slice -------------------------------------------
  rvol:
    enabled: true
    lookback_days: 20          # average of the PREVIOUS 20 sessions
  sustained_volume:
    enabled: true
    window_days: 7             # doc says "last 5-7"; 7 is the looser end
    threshold: 1.5             # RVOL above this counts as a heavy day
    rvol_lookback_days: 20
  up_down_volume_ratio:
    enabled: true
    window_days: 20            # volume on green days vs red days
  price_volume_agreement:
    enabled: true
    window_days: 10            # price up AND volume up over the window
    min_price_change: 0.03     # "rising" must mean something; 3% over 10 days
    min_volume_change: 0.10
  price_volume_divergence:
    enabled: true
    window_days: 10            # price up while volume shrinks
    min_price_change: 0.03
    max_volume_change: -0.10
  traded_value:
    enabled: true              # close x matched volume; comparable across prices
  volume_dry_up:
    enabled: true
    max_rvol: 0.7              # volume well below normal
    rvol_lookback_days: 20
    quiet_days: 3              # ... and sustained, not a single quiet session

  # --- doc §5.1-5.2, per-symbol trend and levels -------------------------
  # These read PRICE only, never volume, so they remain available on
  # backfilled spans where the price is adjusted and the volume never could be.
  ma_20:            {enabled: true, window_days: 20}
  ma_50:            {enabled: true, window_days: 50}
  ma_20_slope:      {enabled: true, window_days: 20, slope_days: 5}
  ma_50_slope:      {enabled: true, window_days: 50, slope_days: 10}
  price_vs_ma_20:   {enabled: true, window_days: 20}
  price_vs_ma_50:   {enabled: true, window_days: 50}
  price_change_10d: {enabled: true, window_days: 10}
  price_change_20d: {enabled: true, window_days: 20}
  near_support:
    enabled: true
    lookback_days: 60          # doc §5.2: "held at least twice in the last 60 days"
    pivot_k: 2                 # a pivot needs 2 rows either side to be confirmed
    tolerance: 0.02            # "within ~2%"
    min_touches: 2             # once is an accident; twice is a level
  near_resistance:
    enabled: true
    lookback_days: 60
    pivot_k: 2
    tolerance: 0.02
    min_touches: 2

  # --- doc §5.3, market regime from the index ----------------------------
  # Computed ONCE per run from index_bar and joined onto every symbol by
  # trade_date. A symbol day the index does not cover is NaN, never
  # forward-filled: carrying yesterday's regime forward would assert a market
  # state we have no index for.
  index_above_ma_50:       {enabled: true, window_days: 50}
  index_ma_50_slope:       {enabled: true, window_days: 50, slope_days: 10}
  index_change_20d:        {enabled: true, window_days: 20}
  index_drawdown_from_high: {enabled: true, window_days: 60}

  # --- doc §5.3, breadth (its own frame; features/breadth.py) -------------
  # Over ALL TRADEABLE stocks, not the liquid universe (Ben, 2026-09-23): the
  # point is the broad participation the cap-weighted index misses. Direction
  # on the ADJUSTED close. A stock counts only if it also traded the session
  # before.
  #
  # Thin-day guard: a session counting < min_count_share x the median count of
  # the previous count_median_sessions is blanked. It is a DATA-DEFECT guard (a
  # lost exchange file), not a research threshold. 0.80 was set on 2026-09-23
  # from the measured distribution of count / trailing median, before any
  # breadth statistic was computed: median 1.00, 5th pct 0.93, 2nd pct 0.85.
  # Every whole-exchange loss is <= 0.73 (2025-05-05/06, 2024-12-02..05,
  # 2023-01 cluster, 2018-01-23..25 HOSE halt); most lost HNX files are
  # 0.76-0.83. Blanks 54 of 3,689 sessions. Known ceiling: partial losses at
  # 0.80-0.90 pass and bias that day by a few points.
  breadth_advance_share:
    enabled: true
    min_count_share: 0.80
    count_median_sessions: 20
  breadth_advance_share_10d:
    enabled: true
    window_days: 10
    min_count_share: 0.80
    count_median_sessions: 20

# Which index the regime measures read. VN-Index is the market doc §5.3 means.
market:
  index_symbol: VNINDEX
